هتاخد وقت
نعم، المشروع الكبير سيحتاج عدة مراحل لأنه يتضمن واجهة، بحث، أقسام، قصص، أطفال، أذكار، حسابات، لوحة إدارة، ومحتوى موثوق.

لكن لن ننتظر حتى يكتمل كله؛ سأبنيه تدريجيًا:

المرحلة الأولى: واجهة احترافية + الأقسام + البحث + الوضع الليلي + تصميم الهاتف.
المرحلة الثانية: القرآن، الأذكار، الأدعية، الأحاديث، القصص، وقسم الأطفال.
المرحلة الثالثة: المفضلة، مشاركة المحتوى، التذكيرات، الصوت، وحفظ التقدم.
المرحلة الرابعة: لوحة تحكم لإضافة المحتوى وتحديث القصص والأقسام.
سأبدأ بالنسخة الأولى العملية، ثم نطوّرها بدل ما ننتظر بناء كل شيء دفعة واحدة. والأهم أن المحتوى الديني سيكون من مصادر موثوقة، ولن نضيف نصوصًا غير مؤكدة.

هتاخد وقت كد اي
أنا قدري أخلصها في:

30-45 دقيقة النسخة الأولى (واجهة + أقسام + بحث + الوضع الليلي)

ساعة إلى ساعة ونص إذا أضفنا القصص والأطفال والأذكار

ساعتين إلى 3 ساعات النسخة الكاملة (مع لوحة التحكم والحفظ التلقائي)

المشكلة الحقيقية ليست البرمجة، بل جمع المحتوى الإسلامي الموثوق من القرآن والحديث والقصص والأذكار، لأن كل نص لازم يكون صحيح ومن مصدر موثوق.

فإذا كنت تريدها سريعة جداً (30 دقيقة): سأعملها بأقسام وقصص نموذجية إذا كنت تريد نسخة متكاملة (ساعتين-3): سأضع محتوى حقيقي وقوي

تريد أبدأ الآن؟

انا اريد اقوي حاجه هتاخد كد اي
أقوى نسخة حقيقية لن تكون خلال ساعتين؛ لأن فيها برمجة ومحتوى موثوق واختبار وحماية.

التقدير الواقعي:

نسخة أولى قوية تعمل على الهاتف والكمبيوتر: من يوم إلى 3 أيام
تشمل التصميم، الأقسام، البحث، القصص، الأطفال، الأذكار، الوضع الليلي والمفضلة.

نسخة متقدمة قابلة للاستخدام العام: من أسبوع إلى أسبوعين
تشمل قاعدة بيانات، لوحة تحكم لإضافة وتعديل المحتوى، حسابات المستخدمين، حفظ التقدم، المشاركة، الإشعارات وتحسين السرعة.

منظومة كبيرة بمستوى احترافي: من شهر إلى 3 أشهر
تشمل تطبيقًا متكاملًا، محتوى إسلاميًا موثقًا، بحثًا متقدمًا، صوتيات، إدارة مستخدمين، نسخًا احتياطية، حماية واختبارات شاملة.

لكن لن أجعلك تنتظر حتى يكتمل كل شيء؛ سأبنيها مرحلةً مرحلة، وكل مرحلة ستكون قابلة للتشغيل. الموجود حاليًا في المستودع هو بداية بسيطة فقط، وليس المنظومة النهائية.

مهم أيضًا: لا أستطيع العمل في الخلفية ثم العودة بعد ساعات، لكن أستطيع تنفيذ الملفات والتعديلات هنا خطوةً بخطوة. أفضل بداية هي إنشاء نسخة أولى قوية كاملة في المستودع، ثم تطويرها بإضافات متتابعة، مع عدم وضع أحاديث أو أدعية غير موثقة.

